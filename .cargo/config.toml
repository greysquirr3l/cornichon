# Project-local cargo configuration.
#
# The `l` alias runs clippy with the full project lintset from ~/Projects/nick.md
# ("Rust Standards (all projects)"). Use it instead of plain `cargo clippy` so
# the same lint configuration runs locally and in CI.
#
# The lint levels themselves live in the root `Cargo.toml` under
# `[workspace.lints]`, not in this alias. Cargo appends any user-supplied
# arguments *after* the alias body, so an alias containing a `--` separator
# would push trailing arguments (`-p cornichon`, `--workspace --all-targets`)
# into the rustc flag list and fail with "Unrecognized option". Keeping the
# alias flag-free lets every invocation shape work:
#
#   cargo l                              — lint the whole workspace
#   cargo l -p cornichon                 — lint one crate
#   cargo l --workspace --all-targets    — what CI runs
#
# Note: if you see stale or missing diagnostics from VS Code's language server,
# trust the terminal — run `RUSTC_WRAPPER= SCCACHE_DISABLE=1 cargo l -p <crate>`
# directly. See ~/Projects/nick.md for context.

[alias]
l = ["clippy"]

# Build, serve, and test the mdbook source under `./book`. The wrapper
# binary lives at `tools/mdbook/`; it shells out to the externally-
# installed `mdbook` binary, so we don't pull it in as a Rust dep.
#
# Usage:
#   cargo book build     — mdbook build book
#   cargo book serve     — mdbook serve book  (http://localhost:3000)
#   cargo book test      — cargo test --workspace --doc
#   cargo book all       — build + test (CI entry point)
#
# First-time setup: `cargo install mdbook --locked`
book = ["run", "--manifest-path", "tools/mdbook/Cargo.toml", "--quiet", "--"]

