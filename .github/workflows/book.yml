name: book

on:
  push:
    branches: [main]
    paths: [book/**, .github/workflows/book.yml]
  workflow_dispatch:

# No deploy concurrency lock — book deploys are idempotent and
# a stale deploy is acceptable (Pages will pick up the next successful run).
concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid overlapping actions on the environment repo.
environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

jobs:
  deploy:
    name: mdbook → GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install mdbook
        run: |
          # Pinned to a stable mdbook version. Update both the URL and the
          # hash together if upgrading.
          curl -sSL \
            https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | sudo tar xz -C /usr/local/bin

      - name: Build the book
        # `mdbook build book` writes to `book/book` per `book.toml`.
        run: mdbook build book

      - name: Verify the build output exists
        run: |
          test -f book/book/index.html || {
            echo "mdbook build did not produce book/book/index.html" >&2
            exit 1
          }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
