[workspace]
resolver = "2"
members = [
    "crates/cornichon",
    "examples/cornichon-slash",
    "examples/cornichon-choice",
    "examples/cornichon-picker",
    "examples/cornichon-shortcuts",
    "examples/cornichon-spinner",
    "tools/mdbook",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.96"
readme = "README.md"
repository = "https://github.com/greysquirr3l/cornichon"
documentation = "https://docs.rs/cornichon"
homepage = "https://github.com/greysquirr3l/cornichon"
description = "A composable Rust library for terminal-UI menu patterns — slash-command palettes, permission prompts, project pickers, keyboard-shortcut modals — themed after Claude Code, Codex, and Grok CLI captures."
keywords = ["tui", "ratatui", "menu", "palette", "cli"]
categories = ["command-line-interface", "gui"]

[workspace.dependencies]
ratatui = "0.30"
crossterm = "0.29"
thiserror = "2"
anyhow = "1"
cornichon = { path = "crates/cornichon" }
